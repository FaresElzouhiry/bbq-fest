<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBQ FEST — المخطط ثلاثي الأبعاد</title>
<meta name="description" content="مخطط مهرجان BBQ FEST ثلاثي الأبعاد: من الأرض الفاضية إلى المهرجان مجسّمًا.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mapui.css">
<style>
  html, body { height: 100%; margin: 0; background: #0c0a0a; font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; }
  #map { position: fixed; inset: 0; }
  .brand { position: fixed; z-index: 10; inset-inline-end: 16px; bottom: 16px; display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 10px; border-radius: 14px; background: rgba(16, 13, 13, .78); border: 1px solid rgba(255, 255, 255, .14); backdrop-filter: blur(12px); color: #f5efe6; text-decoration: none; font-weight: 800; font-size: 13px; }
  .brand img { height: 34px; display: block; }
  .brand span { opacity: .7; font-weight: 600; }
  .brand:hover span { opacity: 1; }
  .mapui-zones { margin-inline: 0 auto !important; }
  .mapui-card { bottom: 84px; }
  @media (max-width: 860px) { .brand { display: none; } }
  .loading { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #0c0a0a; color: #f5efe6; transition: opacity .6s; }
  .loading.off { opacity: 0; pointer-events: none; }
  .loading img { width: 150px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; transform: scale(.97); } }
</style>
</head>
<body>
<div class="loading" id="loading"><img src="assets/logo-light.png" alt="BBQ FEST"></div>
<div id="map"></div>
<a class="brand" href="index.html"><img src="assets/logo-light.png" alt="BBQ FEST"><span>← الرجوع للموقع</span></a>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/data.js"></script>
<script src="js/festival3d.js"></script>
<script src="js/mapui.js"></script>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var ui = MapUI.mount(document.getElementById('map'), {
      theme: q.get('theme') || 'sunset',
      stage: q.has('stage') ? +q.get('stage') : (q.has('walk') ? 2 : 0),
      embedded: false, autoRotate: true, intro: true,
      bookHref: function (info) {
        var m = 'model-1.html'; try { m = localStorage.getItem('bbq-model') || m; } catch (e) {}
        return m + '?booth=' + encodeURIComponent(info.id) + '#booking';
      }
    });
    window.__ui = ui;
    if (ui && q.has('walk')) setTimeout(function () { ui.f3d.setMode('walk'); }, 1500);
    setTimeout(function () { document.getElementById('loading').classList.add('off'); }, 500);
    // عرض تلقائي: الأرض ← المخطط ← المهرجان
    if (ui && !q.has('stage') && !q.has('walk')) {
      var stop = false; document.getElementById('map').addEventListener('pointerdown', function () { stop = true; }, { once: true });
      setTimeout(function () { if (!stop) ui.f3d.setStage(1); }, 4200);
      setTimeout(function () { if (!stop) ui.f3d.setStage(2); }, 8200);
    }
  })();
</script>
</body>
</html>
